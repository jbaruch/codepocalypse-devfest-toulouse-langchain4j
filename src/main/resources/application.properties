# Application Configuration
quarkus.application.name=airline-loyalty-assistant

# Quarkus LangChain4j OpenAI Configuration
# API key is loaded from .env file (see .env.example)
# You can also set it via environment variable: OPENAI_API_KEY
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.7
quarkus.langchain4j.openai.timeout=30s
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true

# Conversation Memory Configuration
# Use message window memory to retain recent conversation history
quarkus.langchain4j.chat-memory.type=message-window
# Keep last 20 messages in memory (10 exchanges)
quarkus.langchain4j.chat-memory.memory-window.max-messages=20

# Easy RAG Configuration (use classpath resources in src/main/resources/rag)
quarkus.langchain4j.easy-rag.path=rag
quarkus.langchain4j.easy-rag.path-type=classpath
quarkus.langchain4j.easy-rag.recursive=true
quarkus.langchain4j.easy-rag.max-results=5
# Speed up local dev by reusing precomputed embeddings (optional)
quarkus.langchain4j.easy-rag.reuse-embeddings.enabled=true

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."devfest_toulouse.langchain4j".level=INFO
quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG

# HTTP Configuration
quarkus.http.port=8080
